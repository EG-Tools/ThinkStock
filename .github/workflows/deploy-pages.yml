name: ThinkStock 배포
run-name: ${{ inputs.release_title }}

on:
  workflow_dispatch:
    inputs:
      release_title:
        description: 무엇을 보강했는지 간단히 입력하세요
        required: true
        default: ThinkStock 기능 개선
        type: string
      refresh_data:
        description: 배포 전에 전체 데이터를 갱신합니다
        required: true
        default: false
        type: boolean
      verification_scope:
        description: WebKit verification scope; use smoke only after local full verification
        required: true
        default: full
        type: choice
        options:
          - full
          - smoke

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-webkit:
    needs: build-web-artifact
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mobile
          - target: desktop
          - target: sw
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Web Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Cache WebKit Browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-webkit-${{ runner.os }}-

      - name: Install WebKit Test Dependencies
        run: npx playwright install --with-deps webkit

      - name: Download Built Web App
        uses: actions/download-artifact@v8
        with:
          name: thinkstock-pages-shell
          path: docs

      - name: Download E2E Diagnostic Bundle
        uses: actions/download-artifact@v8
        with:
          name: thinkstock-e2e-bundle
          path: .thinkstock-cache/e2e

      - name: Test WebKit ${{ matrix.target }} Interactions
        run: node scripts/run_webkit_scope.mjs ${{ matrix.target }} ${{ inputs.verification_scope }}

  build-web-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Web Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build Plotly Vendor Bundle
        run: npm run vendor:sync

      - name: Build Web App
        run: npm run build:web

      - name: Validate Built Web App
        run: npm run test:unit:built

      - name: Prepare Data-Free Pages Shell
        run: python scripts/prepare_pages_shell.py

      - name: Upload Built Web App
        uses: actions/upload-artifact@v7
        with:
          name: thinkstock-pages-shell
          path: pages-shell
          retention-days: 1

      - name: Upload E2E Diagnostic Bundle
        uses: actions/upload-artifact@v7
        with:
          name: thinkstock-e2e-bundle
          path: .thinkstock-cache/e2e/app.bundle.min.js
          retention-days: 1

  prepare-data:
    if: ${{ inputs.refresh_data }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore Last Known-Good Pages Data
        uses: actions/cache@v5
        with:
          path: docs/data
          key: thinkstock-pages-data-v1-${{ github.run_id }}
          restore-keys: |
            thinkstock-pages-data-v1-

      - name: Snapshot Data Baseline
        run: cp -a docs/data .pages-data-baseline

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-pages.txt

      - name: Install Data Build Dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-pages.txt

      - name: Test Data Regression Guard
        env:
          PYTHONPATH: scripts
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Build Pages Data
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          KOFIA_API_KEY: ${{ secrets.KOFIA_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          ENABLE_FREESIS_CREDIT_TAIL: "1"
          PAGES_FULL_REBUILD: "0"
        run: python scripts/build_pages_data.py

      - name: Publish Data Build Health
        if: always()
        run: python scripts/summarize_build_report.py >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Pages Data
        env:
          KOFIA_API_KEY: ${{ secrets.KOFIA_API_KEY }}
          ENABLE_FREESIS_CREDIT_TAIL: "1"
          PAGES_STRICT_FRESHNESS: "1"
        run: python scripts/validate_pages_data.py

      - name: Reject Data Regression
        run: python scripts/check_pages_data_regression.py --baseline .pages-data-baseline --current docs/data

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate Runtime Data Contract
        run: node scripts/validate_pages_data_local.mjs

      - name: Upload Refreshed Pages Data
        uses: actions/upload-artifact@v7
        with:
          name: thinkstock-pages-data
          path: docs/data
          retention-days: 1

  assemble-artifact:
    runs-on: ubuntu-latest
    needs: [build-web-artifact, prepare-data]
    if: ${{ always() && needs.build-web-artifact.result == 'success' && (needs.prepare-data.result == 'success' || needs.prepare-data.result == 'skipped') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Built Web App
        uses: actions/download-artifact@v8
        with:
          name: thinkstock-pages-shell
          path: docs

      - name: Download Refreshed Pages Data
        if: ${{ inputs.refresh_data }}
        uses: actions/download-artifact@v8
        with:
          name: thinkstock-pages-data
          path: docs/data

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate Runtime Data Contract
        run: node scripts/validate_pages_data_local.mjs

      - name: Stamp Pages Asset Version
        run: python scripts/stamp_pages_assets.py

      - name: Prepare Pages Artifact
        run: python scripts/prepare_pages_artifact.py

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./.pages-artifact

  deploy:
    if: ${{ always() && needs.build-web-artifact.result == 'success' && needs.validate-webkit.result == 'success' && needs.assemble-artifact.result == 'success' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build-web-artifact, validate-webkit, assemble-artifact]
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify-public:
    if: ${{ always() && needs.deploy.result == 'success' }}
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify Public Pages Release
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/verify_pages_deployment.mjs
